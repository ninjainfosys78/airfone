<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 190" role="img" aria-label="Five steps to set up an IVR" font-family="Poppins, Arial, sans-serif">
<rect width="1026" height="190" fill="#FFFFFF"/>
<text x="20" y="34" font-size="18" font-weight="600" fill="#16190F">Five steps to set up an IVR</text>
<rect x="20" y="58" width="170" height="100" rx="10" fill="#F4F8EC" stroke="#DCE5CC"/>
<text x="105" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#16190F">1. Pick number</text>
<text x="105" y="124" text-anchor="middle" font-size="16" fill="#16190F">keep your own</text>
<path d="M196 108 H218" stroke="#3E4636" stroke-width="2" fill="none"/><path d="M212 102 L219 108 L212 114" stroke="#3E4636" stroke-width="2" fill="none"/>
<rect x="224" y="58" width="170" height="100" rx="10" fill="#F4F8EC" stroke="#DCE5CC"/>
<text x="309" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#16190F">2. List</text>
<text x="309" y="124" text-anchor="middle" font-size="16" fill="#16190F">menu options</text>
<path d="M400 108 H422" stroke="#3E4636" stroke-width="2" fill="none"/><path d="M416 102 L423 108 L416 114" stroke="#3E4636" stroke-width="2" fill="none"/>
<rect x="428" y="58" width="170" height="100" rx="10" fill="#F4F8EC" stroke="#DCE5CC"/>
<text x="513" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#16190F">3. Record</text>
<text x="513" y="124" text-anchor="middle" font-size="16" fill="#16190F">greeting</text>
<path d="M604 108 H626" stroke="#3E4636" stroke-width="2" fill="none"/><path d="M620 102 L627 108 L620 114" stroke="#3E4636" stroke-width="2" fill="none"/>
<rect x="632" y="58" width="170" height="100" rx="10" fill="#F4F8EC" stroke="#DCE5CC"/>
<text x="717" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#16190F">4. Route</text>
<text x="717" y="124" text-anchor="middle" font-size="16" fill="#16190F">each key</text>
<path d="M808 108 H830" stroke="#3E4636" stroke-width="2" fill="none"/><path d="M824 102 L831 108 L824 114" stroke="#3E4636" stroke-width="2" fill="none"/>
<rect x="836" y="58" width="170" height="100" rx="10" fill="#2F4F08" stroke="#2F4F08"/>
<text x="921" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">5. Test</text>
<text x="921" y="124" text-anchor="middle" font-size="16" fill="#FFFFFF">call from outside</text>
</svg>
