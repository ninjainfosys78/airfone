<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1026 190" role="img" aria-label="How one bulk call run works" font-family="Poppins, Arial, sans-serif">
<rect width="1026" height="190" fill="#FFFFFF"/>
<text x="20" y="34" font-size="18" font-weight="600" fill="#16190F">How one bulk call run works</text>
<rect x="20" y="58" width="170" height="100" rx="10" fill="#F4F8EC" stroke="#DCE5CC"/>
<text x="105" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#16190F">Upload list</text>
<text x="105" y="124" text-anchor="middle" font-size="16" fill="#16190F">of numbers</text>
<path d="M196 108 H218" stroke="#3E4636" stroke-width="2" fill="none"/><path d="M212 102 L219 108 L212 114" stroke="#3E4636" stroke-width="2" fill="none"/>
<rect x="224" y="58" width="170" height="100" rx="10" fill="#F4F8EC" stroke="#DCE5CC"/>
<text x="309" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#16190F">Write the</text>
<text x="309" y="124" text-anchor="middle" font-size="16" fill="#16190F">message</text>
<path d="M400 108 H422" stroke="#3E4636" stroke-width="2" fill="none"/><path d="M416 102 L423 108 L416 114" stroke="#3E4636" stroke-width="2" fill="none"/>
<rect x="428" y="58" width="170" height="100" rx="10" fill="#F4F8EC" stroke="#DCE5CC"/>
<text x="513" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#16190F">Calls are sent</text>
<text x="513" y="124" text-anchor="middle" font-size="16" fill="#16190F">now</text>
<path d="M604 108 H626" stroke="#3E4636" stroke-width="2" fill="none"/><path d="M620 102 L627 108 L620 114" stroke="#3E4636" stroke-width="2" fill="none"/>
<rect x="632" y="58" width="170" height="100" rx="10" fill="#F4F8EC" stroke="#DCE5CC"/>
<text x="717" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#16190F">Answers saved</text>
<text x="717" y="124" text-anchor="middle" font-size="16" fill="#16190F">per number</text>
<path d="M808 108 H830" stroke="#3E4636" stroke-width="2" fill="none"/><path d="M824 102 L831 108 L824 114" stroke="#3E4636" stroke-width="2" fill="none"/>
<rect x="836" y="58" width="170" height="100" rx="10" fill="#2F4F08" stroke="#2F4F08"/>
<text x="921" y="102" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Review</text>
<text x="921" y="124" text-anchor="middle" font-size="16" fill="#FFFFFF">who needs a call</text>
</svg>
