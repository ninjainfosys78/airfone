# Equivalent 301 redirect map for the routes the static site handles with
# meta-refresh redirect pages. Apply these in nginx for real 301s once the
# hosting owner is ready. `/share/<token>/` needs a regex rule because the
# static build can't enumerate every token at build time.

# Old Nepali root -> new default-locale (Nepali) root.
location = /ne/ { return 301 https://airfone.app/; }
location = /ne/pricing/ { return 301 https://airfone.app/pricing/; }
location = /ne/contact/ { return 301 https://airfone.app/contact/; }

# Old English marketing pages -> new English home.
location = /features/ { return 301 https://airfone.app/en/; }
location = /platform/ { return 301 https://airfone.app/en/; }
location = /services/ { return 301 https://airfone.app/en/; }
location = /about/ { return 301 https://airfone.app/en/; }

# Old Nepali marketing pages -> new Nepali (default) home.
location = /ne/features/ { return 301 https://airfone.app/; }
location = /ne/platform/ { return 301 https://airfone.app/; }
location = /ne/services/ { return 301 https://airfone.app/; }
location = /ne/about/ { return 301 https://airfone.app/; }

# Auth routes, both locales -> the app.
location = /login/ { return 301 https://app.airfone.app/login/; }
location = /register/ { return 301 https://app.airfone.app/register/; }
location = /forgot-password/ { return 301 https://app.airfone.app/forgot-password/; }
location = /reset-password/ { return 301 https://app.airfone.app/reset-password/; }
location = /verify/ { return 301 https://app.airfone.app/verify/; }
location = /verify-otp/ { return 301 https://app.airfone.app/verify-otp/; }
location = /verify-email-otp/ { return 301 https://app.airfone.app/verify-email-otp/; }
location = /verify-phone-otp/ { return 301 https://app.airfone.app/verify-phone-otp/; }
location = /verify-password-reset-otp/ { return 301 https://app.airfone.app/verify-password-reset-otp/; }
location = /verify-password-reset-phone/ { return 301 https://app.airfone.app/verify-password-reset-phone/; }

location = /ne/login/ { return 301 https://app.airfone.app/login/; }
location = /ne/register/ { return 301 https://app.airfone.app/register/; }
location = /ne/forgot-password/ { return 301 https://app.airfone.app/forgot-password/; }
location = /ne/reset-password/ { return 301 https://app.airfone.app/reset-password/; }
location = /ne/verify/ { return 301 https://app.airfone.app/verify/; }
location = /ne/verify-otp/ { return 301 https://app.airfone.app/verify-otp/; }
location = /ne/verify-email-otp/ { return 301 https://app.airfone.app/verify-email-otp/; }
location = /ne/verify-phone-otp/ { return 301 https://app.airfone.app/verify-phone-otp/; }
location = /ne/verify-password-reset-otp/ { return 301 https://app.airfone.app/verify-password-reset-otp/; }
location = /ne/verify-password-reset-phone/ { return 301 https://app.airfone.app/verify-password-reset-phone/; }

# Share links: preserve the token.
location ~ ^/(?:ne/)?share/(.+)$ { return 301 https://app.airfone.app/share/$1; }
